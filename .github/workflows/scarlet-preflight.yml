name: Scarlet AOT preflight (synthetic tests only)

on:
  push:
    paths:
      - '.github/workflows/scarlet-preflight.yml'
      - 'tools/scarlet/**'
      - 'tools/gen.py'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/workflows/scarlet-preflight.yml'
      - 'tools/scarlet/**'
      - 'tools/gen.py'
      - 'Makefile'
  workflow_dispatch:

jobs:
  synthetic-preflight:
    name: Synthetic NSO and NSP parsing on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and synthetic input checks
        run: |
          python -m py_compile tools/scarlet/preflight.py tools/scarlet/build_aot.py tools/scarlet/test_preflight.py tools/gen.py
          python tools/scarlet/test_preflight.py
      - name: Dry-run the Scarlet Makefile target (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          make -n PY=python GEN=generated-scarlet/dry-run B=build/scarlet/dry-run SCARLET_EXEFS=/tmp/exefs gen-scarlet > scarlet-make-dry-run.txt
          grep -q -- '--game scarlet' scarlet-make-dry-run.txt
      - name: Confirm no game files are used
        run: echo "Synthetic-only validation. No AOT execution or gameplay certification."
